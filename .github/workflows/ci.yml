name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  # Bouton « Run workflow » dans GitHub : produit un installeur de test sans créer de release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint (frontières entre couches incluses)
        run: npm run lint

      - run: npm run typecheck

      - name: Tests unitaires, intégration, composants, régression (+ seuils de couverture)
        run: npm test -- --coverage

      - name: Build (electron-vite)
        run: npm run build

      - name: E2E smoke (Playwright + Electron)
        run: npm run test:e2e:smoke

      - name: E2E complet (release)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run test:e2e

      - name: Installeur Windows (release ou lancement manuel)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: npx electron-builder --win --publish never

      - name: Artefact installeur
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Traces E2E en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: ignore
