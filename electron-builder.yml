# Packaging (CLAUDE.md par. 11). Le .exe officiel sort de la CI Windows, jamais du Mac.
appId: mg.church.manager
productName: FJKM Ambatondrazaka Fitiavana
copyright: FJKM Ambatondrazaka Fitiavana

directories:
  buildResources: build
  output: dist

files:
  - out/**
  - package.json
  - '!**/*.{md,ts,tsx,map.json}'
  - '!node_modules/better-sqlite3/{deps,src,binding.gyp}{,/**}'

# Binaire natif hors de l'asar (un .node ne se charge pas depuis une archive asar)
asarUnpack:
  - '**/node_modules/better-sqlite3/**'

# Migrations lues au démarrage depuis process.resourcesPath/drizzle
extraResources:
  - from: drizzle
    to: drizzle
    filter: ['**/*']

# better-sqlite3 >= 12 : binaires N-API précompilés, aucune recompilation
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

# Seules les langues utiles : installeur plus léger, installation plus rapide sur HDD
electronLanguages: [fr, en-US]

# Pas d'auto-update réseau (exclu, CLAUDE.md par. 3)
publish: null

win:
  executableName: fjkm-ambatondrazaka-fitiavana
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64] # ia32 si Windows 32 bits (cf. par. 14 : better-sqlite3 sans binaire ia32)
  files:
    # Ne garder que le binaire SQLite de la cible
    - '!node_modules/better-sqlite3/prebuilds/!(win32-x64).node'

nsis:
  oneClick: true
  perMachine: false # pas de droits admin
  createDesktopShortcut: always
  runAfterFinish: true
  shortcutName: FJKM Ambatondrazaka Fitiavana
  uninstallDisplayName: FJKM Ambatondrazaka Fitiavana
  artifactName: fjkm-ambatondrazaka-fitiavana-${version}-setup.${ext}
  # Les données (%APPDATA%) et sauvegardes (Documents) restent en cas de désinstallation
  deleteAppDataOnUninstall: false
  installerLanguages: [fr_FR]
  language: '1036'

# Builds locaux de contrôle uniquement (non distribués)
mac:
  target: dir
  files:
    - '!node_modules/better-sqlite3/prebuilds/!(darwin-*).node'
linux:
  target: dir
